name: backend-artifacts

on:
  push:
    paths:
      - '**.py'
      - '!tests/**'
    tags:
      - 'v*'
    branches-ignore:
      - '*test*'
  pull_request:
    paths:
      - '**.py'
      - '!tests/**'
  workflow_dispatch:

jobs:
  python-tests:
    name: Python tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '>=3.11 <3.14'
          cache: 'pip'
      - name: Setup
        run: pip install -r requirements.txt
      - name: pytest run
        run: |
          pytest
  artifacts:
    if: github.ref_type == 'tag'
    needs: python-tests
    name: Artifact upload
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22.11'
      - uses: actions/setup-python@v6
        with:
          python-version: '>=3.11 <3.14'
      - name: Python setup
        run: |
          pip install -r requirements.txt
      - name: Artifact build
        run: |
          echo "Current directory: $(pwd)"
          .\build.ps1
      - name: Rename installer to version release
        run: |
          rename-item -path .\Output\entrabulker-installer.exe -newname "entrabulker-installer-${{ github.ref_name }}.exe"
      - name: ZIP packaging
        run: |
          compress-archive .\entrabulker\ ".\entrabulker-${{ github.ref_name }}.zip" -compressionlevel fastest
      - name: File confirmation
        run: |
          if(!(test-path ".\entrabulker-${{ github.ref_name }}.zip")){
            echo "Failed to create ZIP file"
            exit 1
          }
      - name: Set GitHub outputs
        id: latest_output
        run: |
          $make_latest = true
          if("${{ github.ref_name }}" -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$'){ 
            $make_latest = false
          }

          "make_latest=$make_latest" >> $env:GITHUB_OUTPUT
      - name: Artifact upload
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.zip
            ./Output/*.exe
          make_latest: "${{ steps.latest_output.outputs.make_latest }}"